services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    # DATABASE_URL and other secrets come from the host .env file (Supabase).
    # Do not override DATABASE_URL here with a local container hostname.
    env_file:
      - .env
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        # The browser (not this container) calls the API, so this must be
        # an address the browser can reach — the host-exposed api port,
        # not the internal `api` service hostname.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # Public key ID only; required at build time because Next.js
        # inlines NEXT_PUBLIC_* values into the client bundle.
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # This container's own server-side fetches (app/api/agentgate/*
      # route handlers) go through the internal Docker network, not the
      # host-exposed port NEXT_PUBLIC_API_URL points at.
      INTERNAL_API_URL: http://api:8000
    env_file:
      # Only AGENTGATE_HMAC_SECRET is actually used from here (to sign
      # requests on the backend's behalf — see lib/serverAuth.ts); the
      # rest of the root .env is harmless unused noise in this container.
      - .env
    depends_on:
      - api
